# -----------------------------------------------------------
#  [*] Apache — the virtual host
#
#  The one site the image serves: the app's public/ on port
#  8080 (ports.conf), behind the bitlitas-endpoint Caddy.
#  Apache names no version of itself, takes the visitor's
#  address from X-Forwarded-For whichever proxy sends it —
#  the access log, PHP and Laravel then see the visitor, not
#  a proxy — and builds its own redirects on https. The
#  app's folder lists no folder and reads no .htaccess;
#  public/ sends every path that names no file or folder to
#  index.php, Laravel's front controller. Both logs go to
#  /var/www/logs, which docker-compose.yml binds to
#  _DATA/web-apache on the host.
#
#  Used by:
#    - Dockerfile (the folder above) — copies it over the
#      image's own 000-default.conf, the site it enables
#    - ApacheConfigTest (tests/Platform) — reads it; the
#      Server suite checks the same rules over HTTP
# -----------------------------------------------------------

ServerName bitlitas.lt

# Name no version in the Server header or on Apache's own error pages.
# Debian's conf-enabled/security.conf says ServerTokens OS and
# ServerSignature On; this file is read after it, so these win
ServerTokens Prod
ServerSignature Off

# Take the real client IP from X-Forwarded-For, whichever peer sends
# it: Apache runs deep inside the infrastructure, behind proxies of
# every kind of address, so every one of them is trusted and the
# visitor is the header's first address. Only the containers of the
# stack's internal network reach Apache, the endpoint among them.
# Each family is named as its two halves, since mod_remoteip takes
# no mask of zero bits
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 0.0.0.0/1 128.0.0.0/1 ::/1 8000::/1

<VirtualHost *:8080>
	ServerAdmin admin@bitlitas.lt
	# TLS ends at the Caddy endpoint: the scheme makes the URLs Apache
	# builds itself — the slash mod_dir adds to a folder — https ones
	ServerName https://bitlitas.lt
	DocumentRoot /var/www/html/public/

	ErrorLog /var/www/logs/error.log
	LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" proxy
	CustomLog /var/www/logs/access.log proxy
</VirtualHost>

<Directory /var/www/html >
	Options -Indexes +FollowSymLinks -MultiViews
	AllowOverride None
	Require all granted
</Directory>

<Directory /var/www/html/public >
	# The front controller: a path that is no file and no folder of
	# public/ goes to index.php, which Laravel routes by the URL
	RewriteEngine On
	RewriteCond %{REQUEST_FILENAME} !-f
	RewriteCond %{REQUEST_FILENAME} !-d
	RewriteRule ^ index.php [L]
</Directory>
